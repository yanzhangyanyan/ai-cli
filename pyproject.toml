[project]
name = "aicommand"
version = "0.1.3"
description = "AI-Powered Command Line Agent — Describe what you want, it executes for you"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.11"
keywords = ["ai", "cli", "agent", "ssh", "automation", "llm", "mcp", "devops", "remote", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncssh>=2.23.0",
    "mcp>=1.27.1",
    "openai>=2.37.0",
]

[project.scripts]
aicli = "aicli.cli:main"

[project.urls]
Homepage = "https://github.com/yanzhangyanyan/ai-cli"
Repository = "https://github.com/yanzhangyanyan/ai-cli"
Issues = "https://github.com/yanzhangyanyan/ai-cli/issues"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["aicli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
