[project]
name = "aicommand"
version = "0.1.4"
description = "AI-powered CLI agent — describe tasks in natural language, it plans and executes commands autonomously. Supports local, SSH Linux, SSH Windows. Like ChatGPT for your terminal."
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.11"
keywords = ["ai", "cli", "agent", "ssh", "llm", "mcp", "devops", "automation", "shell", "remote-execution", "natural-language", "sysadmin", "ollama", "openai", "python", "terminal", "command-line", "ai-agent", "chatgpt-cli", "ai-automation", "ssh-agent", "ai-shell", "natural-language-shell", "ai-devops", "linux-admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncssh>=2.23.0",
    "mcp>=1.27.1",
    "openai>=2.37.0",
]

[project.scripts]
aicli = "aicli.cli:main"

[project.urls]
Homepage = "https://github.com/yanzhangyanyan/ai-cli"
Repository = "https://github.com/yanzhangyanyan/ai-cli"
Issues = "https://github.com/yanzhangyanyan/ai-cli/issues"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["aicli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
